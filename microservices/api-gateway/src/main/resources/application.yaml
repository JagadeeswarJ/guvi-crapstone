spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: identity-service-auth
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}

        - id: identity-service-users
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/v1/users/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}

        - id: policy-service-applications
          uri: lb://POLICY-SERVICE
          predicates:
            - Path=/api/v1/applications/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}

        - id: policy-service-policies
          uri: lb://POLICY-SERVICE
          predicates:
            - Path=/api/v1/policies/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}

        - id: claims-service
          uri: lb://CLAIMS-SERVICE
          predicates:
            - Path=/api/v1/claims/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

app:
  jwt:
    secret: very-very-very-big-secret-that-you-cant-crack-not-in-a-billion-years-cause-its-256-bits-long
    issuer: identity-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.thehartford.apigateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
